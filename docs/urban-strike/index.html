<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Urban Strike 1.6 Prototype</title><style>html,body{margin:0;overflow:hidden;background:#111;font-family:Arial,sans-serif;touch-action:none}#game{position:fixed;inset:0}#hud{position:fixed;inset:0;color:#fff;pointer-events:none;text-shadow:1px 1px 3px #000}.top{display:flex;justify-content:space-between;padding:12px;font-weight:bold;font-size:16px}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px}.bottom{position:absolute;left:12px;bottom:12px;font-size:18px}.weapon{position:absolute;right:20px;bottom:14px;font-size:18px;text-align:right}.msg{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:26px;font-weight:bold}.controls{position:fixed;inset:0;pointer-events:none}.joy{position:absolute;left:18px;bottom:75px;width:120px;height:120px;border:2px solid #ffffff55;border-radius:50%;background:#ffffff12;pointer-events:auto}.knob{position:absolute;width:52px;height:52px;left:34px;top:34px;border-radius:50%;background:#ffffff55}.fire{position:absolute;right:25px;bottom:95px;width:92px;height:92px;border-radius:50%;background:#c22b;display:flex;align-items:center;justify-content:center;font-weight:bold;pointer-events:auto}.reload{position:absolute;right:135px;bottom:45px;width:70px;height:45px;border-radius:12px;background:#333b;display:flex;align-items:center;justify-content:center;pointer-events:auto;font-size:12px}.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:12px;color:#ddd}@media(min-width:800px){.controls{display:none}}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="top"><span id="team">ALFA 0</span><span id="round">RONDA 1</span><span id="money">$800</span></div><div class="cross">+</div><div class="msg" id="msg"></div><div class="bottom">❤ <span id="hp">100</span> &nbsp; 🛡 <span id="armor">100</span></div><div class="weapon">RIFLE M4<br><span id="ammo">30 / 90</span></div><div class="hint">PC: WASD + mouse + click · Celular: joystick + arrastre + DISPARAR</div></div><div class="controls"><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="fire" id="fire">DISPARAR</div><div class="reload" id="reload">RECARGAR</div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {PointerLockControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/PointerLockControls.js';
const canvas=document.querySelector('#game'),r=new THREE.WebGLRenderer({canvas,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight);r.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x83a0ad);scene.fog=new THREE.Fog(0x83a0ad,35,115);
const cam=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,180);cam.position.set(0,1.7,22);
scene.add(new THREE.HemisphereLight(0xbfd7ff,0x5b4637,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(20,40,10);sun.castShadow=true;scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.85});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(140,140),mat(0x3b403c));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
function box(x,y,z,sx,sy,sz,c){let m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}
for(const b of [[-18,3,-12,12,6,10,0x695e53],[18,4,-16,14,8,12,0x655e4d],[-22,3,12,10,6,15,0x555c60],[22,3,14,10,6,15,0x66564b]])box(...b);
for(const x of [-10,0,10])for(const z of [-2,8])box(x,1,z,2,2,2,0x7a684f);
box(0,2,-28,56,4,2,0x4e5150);box(0,2,28,56,4,2,0x4e5150);box(-28,2,0,2,4,56,0x4e5150);box(28,2,0,2,4,56,0x4e5150);
for(let z=-24;z<25;z+=7)box(0,.012,z,0.4,.02,3,0xc9c5a5);
const weapon=new THREE.Group(),gun=mat(0x20252a),dark=mat(0x111316);let body=new THREE.Mesh(new THREE.BoxGeometry(.28,.22,1.25),gun);body.position.set(.34,-.27,-.72);weapon.add(body);let barrel=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,.9,10),dark);barrel.rotation.x=Math.PI/2;barrel.position.set(.34,-.25,-1.7);weapon.add(barrel);let grip=new THREE.Mesh(new THREE.BoxGeometry(.15,.38,.2),dark);grip.position.set(.34,-.48,-.55);grip.rotation.x=-.2;weapon.add(grip);cam.add(weapon);scene.add(cam);
const controls=new PointerLockControls(cam,document.body);scene.add(controls.getObject());
let hp=100,armor=100,ammo=30,reserve=90,round=1,kills=0,money=800,reloading=false;const enemies=[];
function enemy(x,z){let g=new THREE.Group();let torso=new THREE.Mesh(new THREE.BoxGeometry(.55,.9,.35),mat(0x1f3039));torso.position.y=1.05;g.add(torso);let head=new THREE.Mesh(new THREE.SphereGeometry(.23,12,8),mat(0xb98264));head.position.y=1.72;g.add(head);let leg1=new THREE.Mesh(new THREE.BoxGeometry(.18,.75,.2),mat(0x24252a));leg1.position.set(-.15,.38,0);g.add(leg1);let leg2=leg1.clone();leg2.position.x=.15;g.add(leg2);let arm1=new THREE.Mesh(new THREE.BoxGeometry(.15,.65,.15),mat(0xb98264));arm1.position.set(-.38,1.08,0);g.add(arm1);let arm2=arm1.clone();arm2.position.x=.38;g.add(arm2);g.position.set(x,0,z);g.userData={hp:100,alive:true,cool:0};scene.add(g);enemies.push(g)}
function spawn(){enemies.splice(0).forEach(e=>scene.remove(e));enemy(-18,-20);enemy(17,-8);enemy(-17,3);enemy(17,8)}spawn();
const ray=new THREE.Raycaster();function fire(){if(reloading||ammo<=0)return;ammo--;document.querySelector('#ammo').textContent=ammo+' / '+reserve;ray.setFromCamera(new THREE.Vector2(0,0),cam);const hits=ray.intersectObjects(enemies,true);if(hits.length){let root=hits[0].object;while(root.parent&&!root.userData.hp)root=root.parent;if(root.userData.hp){root.userData.hp-=50;if(root.userData.hp<=0){scene.remove(root);kills++;money+=300;document.querySelector('#money').textContent='$'+money}}}}
function reload(){if(reloading||ammo===30||reserve<=0)return;reloading=true;setTimeout(()=>{let n=Math.min(30-ammo,reserve);ammo+=n;reserve-=n;reloading=false;document.querySelector('#ammo').textContent=ammo+' / '+reserve},900)}
window.addEventListener('mousedown',()=>{if(!('ontouchstart'in window))controls.lock();fire()});window.addEventListener('keydown',e=>{if(e.code==='KeyR')reload()});document.querySelector('#fire').addEventListener('touchstart',e=>{e.preventDefault();fire()},{passive:false});document.querySelector('#reload').addEventListener('touchstart',e=>{e.preventDefault();reload()},{passive:false});
let joy=document.querySelector('#joy'),knob=document.querySelector('#knob'),joyId=null,jx=0,jy=0;joy.addEventListener('touchstart',e=>{joyId=e.changedTouches[0].identifier},{passive:true});joy.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===joyId){let q=joy.getBoundingClientRect(),x=t.clientX-(q.left+60),y=t.clientY-(q.top+60),d=Math.min(45,Math.hypot(x,y)),a=Math.atan2(y,x);jx=Math.cos(a)*d/45;jy=Math.sin(a)*d/45;knob.style.transform=`translate(${jx*45}px,${jy*45}px)`}},{passive:true});joy.addEventListener('touchend',()=>{jx=jy=0;knob.style.transform='translate(0,0)'},{passive:true});
let lastTouch=null;addEventListener('touchstart',e=>{for(const t of e.changedTouches)if(t.clientX>150&&t.clientY<innerHeight-150)lastTouch={x:t.clientX,y:t.clientY,id:t.identifier}},{passive:true});addEventListener('touchmove',e=>{if(!lastTouch)return;for(const t of e.changedTouches)if(t.identifier===lastTouch.id){cam.rotation.y-=(t.clientX-lastTouch.x)*.004;cam.rotation.x-=(t.clientY-lastTouch.y)*.003;cam.rotation.x=Math.max(-1.35,Math.min(1.35,cam.rotation.x));lastTouch.x=t.clientX;lastTouch.y=t.clientY}},{passive:true});addEventListener('touchend',()=>lastTouch=null,{passive:true});
const keys={};addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);
let prev=performance.now();function loop(now){let dt=Math.min(.05,(now-prev)/1000);prev=now;let f=(keys.KeyW?1:0)-(keys.KeyS?1:0)-jy,s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+jx,speed=7;if(Math.hypot(f,s)>1){let q=Math.hypot(f,s);f/=q;s/=q}controls.moveForward(f*speed*dt);controls.moveRight(s*speed*dt);cam.position.y=1.7;cam.position.x=Math.max(-26,Math.min(26,cam.position.x));cam.position.z=Math.max(-26,Math.min(26,cam.position.z));
for(const e of enemies){if(!e.parent)continue;let d=e.position.distanceTo(cam.position);e.userData.cool-=dt;if(d<28){let dir=new THREE.Vector3().subVectors(cam.position,e.position);dir.y=0;dir.normalize();e.lookAt(cam.position.x,e.position.y,cam.position.z);if(d>5)e.position.addScaledVector(dir,dt*1.2);if(d<18&&e.userData.cool<=0){e.userData.cool=1.4;hp-=8;document.querySelector('#hp').textContent=Math.max(0,hp);if(hp<=0){hp=100;armor=100;round++;money=800;ammo=30;reserve=90;spawn();document.querySelector('#round').textContent='RONDA '+round;document.querySelector('#money').textContent='$800'}}}}
if(enemies.filter(e=>e.parent).length===0){round++;money+=1800;ammo=30;reserve=90;spawn();document.querySelector('#round').textContent='RONDA '+round;document.querySelector('#money').textContent='$'+money}
r.render(scene,cam);requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
</script></body></html>
